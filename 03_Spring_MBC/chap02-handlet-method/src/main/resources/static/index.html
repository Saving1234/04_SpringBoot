<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>index</title>
</head>
<body>
    <h1>Chap02. 메소드의 파라미터와 어노테이션</h1>

    <h3>1. WebRequest로 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/regist'">파라미터 전달하기</button>

    <h3>1. RequestParam으로 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/modify'">@RequestParam 이용하기</button>

    <h3>2. ModelAttribute로 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/search'">@ModelAttribute 이용하기</button>

    <h3>4. HttpSection로 요청 파라미터 전달 받기</h3>
    <button onclick="location.href='/first/login'">Session에 정보담기</button>

    <h3>5. @RequestBody 이용하기</h3>
    <button onclick="location.href='/first/body'">RequestBody 이용하기</button>

    <h3>[Session] 정보</h3>
    <div th:if="${session.id != null}">
        <p th:text="|${session.id}님 환영합니다.|"></p>
    </div>

</body>
</html>
